<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Distributed Computing Platform</title>
    <style>
        :root {
            --bg-primary: #0f172a;
            --bg-secondary: #1e293b;
            --bg-card: #334155;
            --text-primary: #f1f5f9;
            --text-secondary: #94a3b8;
            --accent: #3b82f6;
            --accent-hover: #2563eb;
            --success: #22c55e;
            --warning: #f59e0b;
            --danger: #ef4444;
            --border: #475569;
            --radius: 8px;
        }
        [data-theme="light"] {
            --bg-primary: #f8fafc;
            --bg-secondary: #e2e8f0;
            --bg-card: #ffffff;
            --text-primary: #1e293b;
            --text-secondary: #64748b;
            --border: #cbd5e1;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            line-height: 1.6;
            min-height: 100vh;
        }
        .app-header {
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border);
            padding: 12px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .app-header h1 { font-size: 1.2rem; color: var(--accent); }
        .nav-tabs {
            display: flex;
            gap: 4px;
            overflow-x: auto;
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border);
            padding: 0 20px;
        }
        .nav-tab {
            padding: 10px 16px;
            cursor: pointer;
            border-bottom: 2px solid transparent;
            color: var(--text-secondary);
            font-size: 0.9rem;
            white-space: nowrap;
            transition: all 0.2s;
        }
        .nav-tab:hover { color: var(--text-primary); }
        .nav-tab.active { color: var(--accent); border-bottom-color: var(--accent); }
        .main-content {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
        }
        .page { display: none; }
        .page.active { display: block; }
        .grid { display: grid; gap: 16px; }
        .grid-2 { grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); }
        .grid-3 { grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); }
        .grid-4 { grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); }
        .card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 20px;
        }
        .card h3 { margin-bottom: 12px; font-size: 1rem; color: var(--text-secondary); }
        .stat-value { font-size: 2rem; font-weight: 700; color: var(--accent); }
        .stat-label { font-size: 0.85rem; color: var(--text-secondary); }
        .status-online { color: var(--success); }
        .status-offline { color: var(--danger); }
        .status-busy { color: var(--warning); }
        .status-idle { color: var(--accent); }
        .node-card { display: flex; flex-direction: column; gap: 8px; }
        .node-card .node-header { display: flex; justify-content: space-between; align-items: center; }
        .node-card .node-name { font-weight: 600; }
        .badge {
            padding: 2px 8px;
            border-radius: 12px;
            font-size: 0.75rem;
            font-weight: 600;
        }
        .badge-online { background: rgba(34,197,94,0.2); color: var(--success); }
        .badge-offline { background: rgba(239,68,68,0.2); color: var(--danger); }
        .badge-busy { background: rgba(245,158,11,0.2); color: var(--warning); }
        .btn {
            padding: 8px 16px;
            border: none;
            border-radius: var(--radius);
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: 500;
            transition: all 0.2s;
        }
        .btn-primary { background: var(--accent); color: white; }
        .btn-primary:hover { background: var(--accent-hover); }
        .btn-danger { background: var(--danger); color: white; }
        .btn-outline { background: transparent; border: 1px solid var(--border); color: var(--text-primary); }
        .btn-sm { padding: 4px 12px; font-size: 0.8rem; }
        .form-group { margin-bottom: 16px; }
        .form-group label { display: block; margin-bottom: 4px; font-size: 0.9rem; color: var(--text-secondary); }
        .form-group input, .form-group select, .form-group textarea {
            width: 100%;
            padding: 8px 12px;
            border: 1px solid var(--border);
            border-radius: var(--radius);
            background: var(--bg-primary);
            color: var(--text-primary);
            font-size: 0.9rem;
        }
        .progress-bar {
            height: 6px;
            background: var(--border);
            border-radius: 3px;
            overflow: hidden;
        }
        .progress-bar .fill {
            height: 100%;
            background: var(--accent);
            transition: width 0.3s;
        }
        .toast-container { position: fixed; top: 80px; right: 20px; z-index: 1000; }
        .toast {
            padding: 12px 20px;
            border-radius: var(--radius);
            margin-bottom: 8px;
            background: var(--bg-card);
            border: 1px solid var(--border);
            animation: slideIn 0.3s ease;
        }
        @keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
        .login-page { display: flex; align-items: center; justify-content: center; min-height: 100vh; }
        .login-box { background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius); padding: 40px; width: 100%; max-width: 400px; }
        .hidden { display: none !important; }
        @media (max-width: 768px) {
            .nav-tab { padding: 8px 12px; font-size: 0.8rem; }
            .main-content { padding: 12px; }
            .stat-value { font-size: 1.5rem; }
            .grid-2, .grid-3, .grid-4 { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <div id="app">
        <div id="login-page" class="login-page">
            <div class="login-box">
                <h1 style="text-align:center; margin-bottom: 24px; color: var(--accent);">Distributed Platform</h1>
                <div class="form-group">
                    <label>Username</label>
                    <input type="text" id="login-username" placeholder="admin">
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="login-password" placeholder="Enter password">
                </div>
                <button class="btn btn-primary" style="width:100%" onclick="login()">Sign In</button>
                <p id="login-error" style="color: var(--danger); margin-top: 12px; font-size: 0.9rem;"></p>
            </div>
        </div>
        <div id="main-app" class="hidden">
            <header class="app-header">
                <h1>Distributed Platform</h1>
                <div style="display:flex; gap:12px; align-items:center;">
                    <span id="user-info" style="color: var(--text-secondary);"></span>
                    <button class="btn btn-outline btn-sm" onclick="logout()">Logout</button>
                    <button class="btn btn-outline btn-sm" onclick="toggleTheme()">Theme</button>
                </div>
            </header>
            <nav class="nav-tabs">
                <div class="nav-tab active" data-page="dashboard" onclick="showPage('dashboard')">Dashboard</div>
                <div class="nav-tab" data-page="nodes" onclick="showPage('nodes')">Nodes</div>
                <div class="nav-tab" data-page="groups" onclick="showPage('groups')">Groups</div>
                <div class="nav-tab" data-page="jobs" onclick="showPage('jobs')">Jobs</div>
                <div class="nav-tab" data-page="models" onclick="showPage('models')">Models</div>
                <div class="nav-tab" data-page="training" onclick="showPage('training')">Training</div>
                <div class="nav-tab" data-page="remote" onclick="showPage('remote')">Remote</div>
                <div class="nav-tab" data-page="cluster" onclick="showPage('cluster')">Cluster</div>
            </nav>
            <main class="main-content">
                <div id="page-dashboard" class="page active"></div>
                <div id="page-nodes" class="page"></div>
                <div id="page-groups" class="page"></div>
                <div id="page-jobs" class="page"></div>
                <div id="page-models" class="page"></div>
                <div id="page-training" class="page"></div>
                <div id="page-remote" class="page"></div>
                <div id="page-cluster" class="page"></div>
            </main>
        </div>
    </div>
    <div class="toast-container" id="toast-container"></div>
    <script>
        let token = localStorage.getItem("token");
        let currentPage = 'dashboard';
        let wsConnection = null;

        function showToast(msg, type='info') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = 'toast';
            toast.textContent = msg;
            container.appendChild(toast);
            setTimeout(() => toast.remove(), 4000);
        }

        async function api(path, method='GET', body=null) {
            const headers = { 'Content-Type': 'application/json' };
            if (token) headers['Authorization'] = `Bearer ${token}`;
            const opts = { method, headers };
            if (body) opts.body = JSON.stringify(body);
            const res = await fetch(path, opts);
            if (res.status === 401) {
                token = null;
                localStorage.removeItem('token');
                document.getElementById('login-page').classList.remove('hidden');
                document.getElementById('main-app').classList.add('hidden');
                throw new Error('Session expired. Please login.');
            }
            if (!res.ok) throw new Error(`API error: ${res.status}`);
            return res.json();
        }

        async function login() {
            const username = document.getElementById('login-username').value;
            const password = document.getElementById('login-password').value;
            try {
                const res = await fetch('/api/v1/auth/token/json', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                const data = await res.json();
                token = data.access_token;
                localStorage.setItem('token', token);
                document.getElementById('login-page').classList.add('hidden');
                document.getElementById('main-app').classList.remove('hidden');
                document.getElementById('user-info').textContent = username;
                loadDashboard();
                startWebSocket();
                showToast('Logged in successfully');
            } catch(e) {
                document.getElementById('login-error').textContent = e.message;
            }
        }

        function logout() {
            token = null;
            localStorage.removeItem('token');
            document.getElementById('main-app').classList.add('hidden');
            document.getElementById('login-page').classList.remove('hidden');
            if (wsConnection) wsConnection.close();
        }

        function toggleTheme() {
            const html = document.documentElement;
            const current = html.getAttribute('data-theme');
            html.setAttribute('data-theme', current === 'light' ? 'dark' : 'light');
        }

        function showPage(page) {
            document.querySelectorAll('.nav-tab').forEach(t => t.classList.toggle('active', t.dataset.page === page));
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.getElementById(`page-${page}`).classList.add('active');
            currentPage = page;
            loadPage(page);
        }

        function loadPage(page) {
            const loaders = { dashboard: loadDashboard, nodes: loadNodes, groups: loadGroups, jobs: loadJobs, models: loadModels, training: loadTraining, remote: loadRemote, cluster: loadCluster };
            if (loaders[page]) loaders[page]();
        }

        function startWebSocket() {
            const ws = new WebSocket(`wss://dp-platform-2026.loca.lt/ws/system`);
            ws.onmessage = (event) => {
                const data = JSON.parse(event.data);
                if (data.type === 'metrics') refreshDashboard();
            };
            wsConnection = ws;
        }

        async function loadDashboard() {
            const el = document.getElementById('page-dashboard');
            try {
                const stats = await api('/api/v1/jobs/cluster/summary');
                el.innerHTML = `
                    <h2 style="margin-bottom:16px;">Dashboard</h2>
                    <div class="grid grid-4">
                        <div class="card"><div class="stat-label">Nodes Online</div><div class="stat-value">${stats.cluster.online}</div></div>
                        <div class="card"><div class="stat-label">CPU Cores</div><div class="stat-value">${stats.cluster.total_cpu_cores}</div></div>
                        <div class="card"><div class="stat-label">RAM (GB)</div><div class="stat-value">${stats.cluster.total_ram_gb}</div></div>
                        <div class="card"><div class="stat-label">GPUs</div><div class="stat-value">${stats.cluster.total_gpus}</div></div>
                    </div>
                    <div class="grid grid-2" style="margin-top:16px;">
                        <div class="card"><h3>Cluster Overview</h3><p>Aggregate distributed resources across ${stats.cluster.total_nodes} nodes.</p></div>
                        <div class="card"><h3>Quick Actions</h3>
                            <button class="btn btn-primary btn-sm" onclick="showPage('nodes')">View Nodes</button>
                            <button class="btn btn-outline btn-sm" onclick="showPage('jobs')">Submit Job</button>
                        </div>
                    </div>
                `;
            } catch(e) { el.innerHTML = `<p>Error loading dashboard: ${e.message}</p>`; }
        }

        async function loadNodes() {
            const el = document.getElementById('page-nodes');
            try {
                const data = await api('/api/v1/nodes/');
                el.innerHTML = `
                    <h2 style="margin-bottom:16px;">Nodes</h2>
                    <div class="grid grid-4">${data.nodes.map(n => `
                        <div class="card node-card">
                            <div class="node-header"><span class="node-name">${n.hostname}</span><span class="badge badge-${n.current_status.toLowerCase()}">${n.current_status}</span></div>
                            <div>CPU: ${n.cpu_cores} cores | ${n.cpu_utilization.toFixed(1)}%</div>
                            <div>RAM: ${(n.available_ram/(1024**3)).toFixed(1)} GB free</div>
                            ${n.gpu_model ? `<div>GPU: ${n.gpu_model} (${n.gpu_vram/(1024**3).toFixed(1)}GB)</div>` : ''}
                            <div>Agent v${n.agent_version}</div>
                            <button class="btn btn-outline btn-sm" onclick="showPage('remote')">Remote Desktop</button>
                        </div>
                    `).join('')}</div>
                `;
            } catch(e) { el.innerHTML = `<p>Error: ${e.message}</p>`; }
        }

        async function loadGroups() {
            const el = document.getElementById('page-groups');
            el.innerHTML = `<h2 style="margin-bottom:16px;">Node Groups</h2><div class="card"><p>Groups management interface</p></div>`;
        }

        async function loadJobs() {
            const el = document.getElementById('page-jobs');
            el.innerHTML = `<h2 style="margin-bottom:16px;">Jobs</h2><div class="card"><p>Job management interface</p></div>`;
        }

        async function loadModels() {
            const el = document.getElementById('page-models');
            el.innerHTML = `<h2 style="margin-bottom:16px;">AI Models</h2><div class="card"><p>Model management interface</p></div>`;
        }

        async function loadTraining() {
            const el = document.getElementById('page-training');
            el.innerHTML = `<h2 style="margin-bottom:16px;">Training</h2><div class="card"><p>AI Training interface</p></div>`;
        }

        async function loadRemote() {
            const el = document.getElementById('page-remote');
            el.innerHTML = `<h2 style="margin-bottom:16px;">Remote Access</h2><div class="card"><p>Remote desktop and terminal interface</p></div>`;
        }

        async function loadCluster() {
            const el = document.getElementById('page-cluster');
            try {
                const stats = await api('/api/v1/jobs/cluster/summary');
                el.innerHTML = `
                    <h2 style="margin-bottom:16px;">Cluster</h2>
                    <div class="card">
                        <h3>Aggregate Resources</h3>
                        <p>Total Nodes: ${stats.cluster.total_nodes}</p>
                        <p>CPU Cores: ${stats.cluster.total_cpu_cores}</p>
                        <p>RAM: ${stats.cluster.total_ram_gb} GB</p>
                        <p>GPUs: ${stats.cluster.total_gpus}</p>
                        <p>VRAM: ${stats.cluster.total_vram_gb} GB</p>
                        <p>Storage: ${stats.cluster.total_storage_tb} TB</p>
                        <p style="color:var(--text-secondary);font-size:0.85rem;margin-top:8px;">Note: These are distributed resources across independent nodes.</p>
                    </div>
                `;
            } catch(e) { el.innerHTML = `<p>Error: ${e.message}</p>`; }
        }

        async function refreshDashboard() { loadDashboard(); }

        window.onload = () => {
            token = localStorage.getItem('token');
            if (token) {
                document.getElementById('login-page').classList.add('hidden');
                document.getElementById('main-app').classList.remove('hidden');
                document.getElementById('user-info').textContent = 'admin';
                loadDashboard();
                startWebSocket();
            }
        };
    </script>
</body>
</html>
